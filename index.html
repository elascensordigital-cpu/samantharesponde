<span class="option-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M15.5 9c-1-2-6-2-7 0-2 4 8 2 7 6-1 3-6 3-7 0"/></svg></span><span>¿Cómo aumentar mis fuentes de ingresos?</span></span><span class="arrow">↗</span></button></div><p class="foot">78 cartas · 8 preguntas · Interpretaciones simbólicas, no predicciones verificables.</p></section><section id="result" class="hidden" aria-live="polite"><button class="back" id="back">← Volver</button><div class="card"><div class="muted" id="question"></div><div class="name" id="cardName"></div><p class="answer" id="answer"></p></div><div class="actions"><button class="primary" id="again">Otra carta ↗</button><button class="secondary" id="homeBtn">Inicio</button></div></section></main><script>
// Cada entrada: [carta, sentimientos, contacto, freno, tendencia de contacto].
const cards = [["El Loco","Curiosidad y atracción espontánea, sin compromiso emocional demostrado.","Puede contactar de forma impulsiva, pero sin garantizar continuidad.","No quiere asumir responsabilidades ni compromisos.","Posible","Puede recordarte espontáneamente, pero no de forma constante.","Prueba hoy una idea pequeña sin comprometer recursos importantes.","Camina 15 minutos por un lugar diferente.","Esperas garantías antes de atreverte a empezar.","Valida una idea de ingresos con una prueba de siete días."],["El Mago","Interés, fascinación y deseo de seducir; no necesariamente amor.","Es una carta favorable a tomar la iniciativa y escribir.","Necesita controlar la situación o decidir cómo acercarse.","Sí","Puede pensar en cómo captar tu atención.","Aplica hoy una habilidad tuya a un problema visible.","Termina una tarea pequeña para recuperar sensación de control.","Tienes recursos, pero los dispersas.","Ofrece una habilidad concreta como servicio con precio fijo."],["La Sacerdotisa","Reserva emocional. No confirma que existan sentimientos ocultos.","Predomina el silencio y la observación.","Prefiere guardar sus pensamientos o no revelarlos.","Poco probable","No hay indicios claros; podría reservarse sus pensamientos.","Haz dos preguntas antes de opinar en tu próxima reunión.","Pasa diez minutos en silencio y sin móvil.","Ignoras información importante o tus propias necesidades.","Investiga qué problema pagaría alguien por resolver."],["La Emperatriz","Afecto, admiración, atracción y deseo de cercanía.","Podría buscar un acercamiento cariñoso.","Comodidad, pasividad o espera que tomes la iniciativa.","Posible","Puede recordarte con cariño o atracción.","Mejora hoy una experiencia para clientes o compañeros.","Prepara algo rico y dedica tiempo a cuidarte.","Atiendes proyectos ajenos antes que los tuyos.","Crea un producto útil a partir de algo que ya sabes hacer."],["El Emperador","Respeto o interés estable, pero poca expresión emocional.","Podría contactar de manera seria y controlada.","Orgullo, rigidez o necesidad de mantener el control.","Posible","Puede pensar en ti con distancia y autocontrol.","Define tres prioridades con plazo y responsable.","Ordena un espacio que te genere estrés.","Quieres controlarlo todo antes de avanzar.","Establece costes, objetivos y seguimiento de ventas."],["El Hierofante","Respeto y aprecio serio, sin implicar necesariamente pasión.","Podría comunicarse de manera prudente o formal.","Normas, compromisos existentes, deberes o creencias.","Posible","Puede recordarte desde el respeto o la costumbre.","Pide consejo a alguien con experiencia demostrable.","Retoma una rutina que antes te funcionaba.","Sigues reglas que ya no encajan contigo.","Ofrece tutorías o formación en una habilidad que domines."],["Los Enamorados","Atracción romántica y conexión; también puede haber una elección pendiente.","El acercamiento depende de que tome una decisión.","Indecisión entre opciones, personas o caminos.","Posible","Puede contemplarte como opción afectiva, pero estar indeciso.","Elige entre dos prioridades y justifica tu elección.","Haz algo coherente con tus valores personales.","Evitas elegir entre caminos incompatibles.","Selecciona un negocio alineado con tus capacidades."],["El Carro","Deseo de avanzar o conquistar, más que ternura.","Favorece una iniciativa decidida y repentina.","Orgullo, objetivos contrapuestos o control de sus impulsos.","Sí","Puede tener el impulso de acercarse.","Reserva 45 minutos para tu tarea de mayor impacto.","Haz veinte minutos de movimiento adaptado a ti.","No has fijado una dirección concreta.","Concéntrate en conseguir la primera venta de una oferta."],["La Fuerza","Atracción o afecto que intenta contener.","Podría contactar después de meditarlo.","Autocontrol y miedo a perder la compostura.","Posible","Puede sentir atracción, pero contenerla.","Mantén esa conversación difícil con una petición concreta.","Respira lentamente dos minutos antes de reaccionar.","Te exiges tanto que terminas agotándote.","Dedica un bloque semanal fijo a generar ingresos."],["El Ermitaño","Distancia emocional y necesidad de soledad; puede no querer una relación.","Predomina el silencio prolongado.","Necesita estar solo o no desea involucrarse.","Poco probable","Puede estar centrado en sí mismo y pensar poco en ti.","Analiza un problema 30 minutos sin interrupciones.","Disfruta un rato de soledad sin redes sociales.","Te aíslas y pierdes apoyo y oportunidades.","Ofrece tu conocimiento especializado a un nicho."],["La Rueda de la Fortuna","Interés cambiante y condicionado por las circunstancias.","Podría haber un contacto inesperado, sin continuidad garantizada.","Inestabilidad o ausencia de una decisión firme.","Indeterminado","Puede recordarte de forma intermitente.","Revisa un cambio reciente de tu sector y adáptate.","Modifica un detalle de tu rutina.","Esperas el momento ideal para actuar.","Diversifica clientes para depender menos de uno solo."],["La Justicia","Valoración racional y respeto, sin demostrar amor.","Podría contactar para aclarar o resolver algo.","Consecuencias, límites y responsabilidades.","Posible","Puede evaluar racionalmente lo ocurrido, sin nostalgia.","Documenta una decisión con hechos y criterios.","Separa por escrito lo controlable de lo que no.","Evitas asumir las consecuencias de una elección.","Calcula beneficio neto y horas por cada proyecto."],["El Colgado","Pasividad o resignación; no demuestra amor reprimido.","No hay iniciativa clara; puede prolongar la espera.","No está dispuesto a actuar o no lo considera prioritario.","Poco probable","Puede pensar ocasionalmente en ti, sin intención de actuar.","Detén una tarea improductiva y cambia el enfoque.","Descansa sin convertirlo en otra obligación.","Esperas que algo externo cambie por ti.","Revisa por qué no vende tu proyecto antes de invertir más."],["La Muerte","Desapego o final de una etapa sentimental.","La tendencia es al cierre, no al regreso.","Ha decidido terminar esa etapa y no reabrirla.","No","Puede estar dejando atrás la historia.","Elimina una actividad que ya no da resultados.","Suelta un objeto o hábito que ya no necesitas.","Te aferras a una etapa que terminó.","Cierra una idea sin demanda y prueba otra."],["La Templanza","Cariño tranquilo, cordialidad o deseo de reconciliación.","Acercamiento gradual, sin prisas.","Necesita tiempo, equilibrio y evitar conflictos.","Posible","Puede recordarte con afecto tranquilo, sin urgencia.","Divide una tarea grande en pasos sostenibles.","Combina un paseo suave con un descanso agradable.","Alternas entre sobreesfuerzo y abandono.","Combina un ingreso estable con otro de crecimiento gradual."],["El Diablo","Deseo sexual, obsesión o apego; no equivale a amor.","Podría contactar por tentación, deseo o necesidad de atención.","Culpa, dependencias o miedo a las consecuencias.","Posible","Puede pensar en ti desde el deseo o el apego, no necesariamente amor.","Limita un hábito que te roba tiempo laboral.","Aléjate una hora de lo que alimenta tu ansiedad.","Repites conductas placenteras que te perjudican a largo plazo.","Descarta negocios con deudas impulsivas o promesas fáciles."],["La Torre","Enfado, conmoción o decepción tras una ruptura.","Si contacta, podría ser para discutir o cortar.","Conflicto, ruptura de confianza o temor a confrontarse.","Poco probable","Puede asociarte con una ruptura o conflicto intenso.","Detecta un fallo importante y propón una solución.","Elimina una fuente concreta de estrés bajo tu control.","Intentas sostener algo que ya no funciona.","Audita costes y elimina dependencias insostenibles."],["La Estrella","Esperanza, ternura o idealización desde la distancia.","Es posible un acercamiento amable, no necesariamente inmediato.","Distancia o idealización sin intención de actuar.","Posible","Puede recordarte con admiración o idealización distante.","Define una meta motivadora y su primer paso.","Haz algo que te devuelva ilusión sin exigencias.","Has perdido confianza en tus posibilidades.","Crea un portafolio que demuestre lo que sabes hacer."],["La Luna","Confusión, inseguridad o emociones contradictorias.","La comunicación sería ambigua o intermitente.","Miedos, incertidumbre o desconfianza.","Indeterminado","Puede pensar en ti con confusión o desconfianza.","Verifica datos antes de decidir por intuición.","Distingue hechos de suposiciones por escrito.","Tus miedos convierten dudas en certezas negativas.","Comprueba demanda y costes antes de invertir."],["El Sol","Alegría, atracción sincera y ganas de compartir tiempo.","Favorece un contacto abierto y positivo.","No destaca un bloqueo emocional; podrían existir circunstancias externas.","Sí","Puede recordarte con alegría y simpatía.","Comparte un logro concreto y reconoce al equipo.","Busca luz natural y disfruta una actividad sencilla.","Ocultas tus logros y minimizas tus capacidades.","Promociona una oferta con resultados demostrables."],["El Juicio","Reevaluación del pasado o necesidad de aclarar asuntos pendientes.","Favorece una reaparición o conversación decisiva.","Culpa o miedo a afrontar el pasado.","Sí","Puede estar revisando lo que ocurrió entre vosotros.","Aprende de un error y define una mejora medible.","Escribe qué etapa quieres cerrar y cómo hacerlo.","Pospones una decisión importante.","Revisa una idea anterior y prueba una versión mejorada."],["El Mundo","Satisfacción o sensación de ciclo terminado; puede haber pasado página.","Predomina el cierre, no la búsqueda de contacto.","Considera que la historia está completada.","Poco probable","Puede considerar la historia terminada.","Termina y entrega un proyecto antes de iniciar otro.","Reconoce tres avances recientes.","Nunca consideras suficiente lo que consigues.","Convierte un proceso probado en un producto repetible."],["As de Copas","Sentimientos nacientes, ternura o apertura afectiva.","Posible mensaje cariñoso o acercamiento emocional.","Miedo a mostrarse vulnerable.","Posible","Puede surgirle un recuerdo afectuoso o una emoción nueva.","Agradece una contribución concreta de un compañero.","Habla con alguien que te escuche.","Te cuesta expresar lo que necesitas.","Ofrece un servicio creativo o de atención personalizada."],["Dos de Copas","Atracción y conexión emocional; deseo de entendimiento.","Favorece el contacto y la reconciliación.","Temor al rechazo o a no ser correspondido.","Sí","Puede recordar vuestra conexión emocional.","Propón una colaboración beneficiosa para ambos.","Contacta con una persona de confianza.","Intentas hacerlo todo sin ayuda.","Crea una oferta conjunta con un profesional complementario."],["Tres de Copas","Simpatía y alegría; puede ser solamente amistad.","Favorece un mensaje informal o amistoso.","Prefiere mantener la relación como amistad.","Sí","Puede recordarte con simpatía, quizá solo amistosa.","Fortalece una relación profesional intercambiando ideas.","Habla o queda con un amigo.","Te falta una red de apoyo activa.","Pide recomendaciones a clientes satisfechos."],["Cuatro de Copas","Apatía, aburrimiento o falta de interés.","Es poco probable que tome la iniciativa.","No tiene suficiente motivación para escribir.","Poco probable","Puede no estar pensando en ti por desinterés.","Revisa una oportunidad que estás ignorando.","Cambia de entorno durante veinte minutos.","La apatía te hace descartar opciones.","Examina la demanda antes de rechazar una oportunidad."],["Cinco de Copas","Tristeza, decepción o arrepentimiento.","Podría contactar desde el pesar, pero también permanecer inmóvil.","Culpa, vergüenza o miedo a revivir la pérdida.","Posible","Puede recordar una decepción o sentir arrepentimiento.","Extrae una mejora concreta de un error.","Permítete estar triste sin revisar el pasado constantemente.","Sigues enfocada en lo que perdiste.","Reutiliza lo que funcionó de un proyecto fallido."],["Seis de Copas","Nostalgia y cariño por los recuerdos; no implica querer volver.","Podría reaparecer por nostalgia.","Idealiza el pasado sin querer necesariamente repetirlo.","Posible","Puede recordarte con nostalgia, sin querer volver.","Recupera un método de trabajo que funcionaba.","Escucha música vinculada a un recuerdo agradable.","Idealizas el pasado y desvalorizas el presente.","Actualiza una habilidad antigua y ofrécela hoy."],["Siete de Copas","Fantasía, idealización o interés disperso.","Puede imaginar escribir sin hacerlo.","Indecisión, distracciones o preferencia por fantasear.","Indeterminado","Puede fantasear contigo, pero tener otras distracciones.","Reduce tus ideas a tres y selecciona una.","Apaga las pantallas y haz una sola actividad.","Acumulas posibilidades sin ejecutar ninguna.","Compara tres ideas por demanda, coste y tiempo."],["Ocho de Copas","Desilusión y decisión de alejarse emocionalmente.","Predomina el distanciamiento voluntario.","Ya no encuentra satisfacción en el vínculo.","No","Puede estar intentando dejar atrás el vínculo.","Abandona una tarea que ya no aporta valor.","Aléjate un rato de lo que te agota.","Insistes en metas que ya no deseas.","Cierra una línea poco rentable."],["Nueve de Copas","Placer, satisfacción personal o gusto por recibir atención.","Podría escribir si le apetece o le resulta gratificante.","Está cómodo sin necesidad de acercarse.","Posible","Puede recordarte con agrado, sin necesitar acercarse.","Identifica qué produjo tu último buen resultado.","Date un pequeño placer consciente.","No disfrutas los logros que ya tienes.","Monetiza una habilidad que ya da buenos resultados."],["Diez de Copas","Amor, felicidad compartida o deseo de armonía.","Favorece un acercamiento afectuoso.","Responsabilidades familiares o expectativas de estabilidad.","Sí","Puede asociarte con felicidad o cercanía.","Resuelve una pequeña fricción en tu equipo.","Pasa tiempo con personas que te hacen bien.","Tus metas no encajan con la vida que deseas.","Busca ingresos compatibles con tus relaciones y bienestar."],["Sota de Copas","Ilusión romántica, ternura o ena
